<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VIP Contact Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Add this in <head> for menu icon to show -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
body {
  background: #ffffff;
  font-family: 'Orbitron', sans-serif;
  padding: 0;
  margin: 0;
}

    .contact-container {
      background: #ffffff;
      border: 2px solid #000;
      box-shadow: 0 0 25px #000;
      padding: 40px 30px;
      border-radius: 25px;
      width: 100%;
      max-width: 550px;
      text-align: center;
    }

    .contact-container h2 {
      color: #000000;
      font-size: 36px;
      margin-bottom: 25px;
    }

    form input,
    form textarea {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      background: #ffffff;
      color: #000;
      border: 2px solid #000;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      box-shadow: inset 0 0 10px #000;
    }

    form textarea {
      resize: none;
      height: 120px;
    }

    .submit-btn {
      background: #000;
      color: #fff;
      font-weight: bold;
      border: none;
      padding: 14px 30px;
      margin-top: 10px;
      font-size: 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      box-shadow: 0 0 20px #000;
      background: #222;
    }

    /* Round Social Logos - Black Glow */
    .logo-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 40px;
  margin-top: 50px;
  flex-wrap: wrap;
}

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #000;
      box-shadow: 0 0 20px #000;
      animation: updown 2s ease-in-out infinite alternate;
      transition: transform 0.3s;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .logo:hover {
      transform: scale(1.1) rotate(3deg);
      box-shadow: 0 0 30px #000;
    }

    @keyframes updown {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }
/* 🔥 Reset and Base Font */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}
body {
  background: #fff;
  color: #111;
}
/* ✅ Header Logo Styling (Fixed) */
.header-logo {
  display: flex;
  align-items: center;
  overflow: hidden;
  max-width: 80%;
}

.header-logo img {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  margin-right: 1rem;
}

.header-logo h1 {
  font-size: 1.6rem;
  font-weight: bold;
  color: gold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.social-logo {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid #000;
  box-shadow: 0 0 20px #000;
  animation: updown 2s ease-in-out infinite alternate;
  transition: transform 0.3s;
}

.social-logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.social-logo:hover {
  transform: scale(1.1) rotate(3deg);
  box-shadow: 0 0 30px #000;
}
.logo h1 {
  font-size: 1.8rem;
  font-weight: bold;
  color: gold;
}

.menu-toggle {
  font-size: 1.5rem;
  cursor: pointer;
  color: gold;
}

nav {
  position: fixed;
  top: 0;
  left: -100%;
  height: 100vh;
  width: 60%;
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(6px);
  transition: 0.3s ease-in-out;
  padding: 5rem 2rem;
  z-index: 999;
}
nav.active {
  left: 0;
}
nav ul {
  list-style: none;
}
nav ul li {
  margin: 2rem 0;
  font-size: 1.3rem;
  color: white;
  cursor: pointer;
}
html, body {
  width: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: #ffffff;
  font-family: 'Orbitron', sans-serif;
}

header {
  width: 100%;
  background: #000;
  color: gold;
  padding: 1rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
}
.main-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 50px 20px;
}
  </style>
</head>
<body>
<header>
  <div class="header-logo">
    <img src="img/brand-logo.jpg" alt="Logo">
    <h1>Z Global Store 🌍</h1>
  </div>
  <i class="fas fa-bars menu-toggle" onclick="toggleMenu()"></i>
</header>

<nav id="sidebar">
  <ul>
    <li onclick="goTo('home')">HOME</li>
    <li onclick="goTo('quran')">QURAN & SEERAT BOOKS</li>
    <li onclick="goTo('contact')">CONTACT</li>
  </ul>
</nav>
  <div class="contact-container">
    <h2>Contact Us</h2>
<div class="main-wrapper">
  <div class="contact-container">
    <h2>Contact Us</h2>
    <form action="https://formsubmit.co/zombievirus321@gmail.com" method="POST">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="thankyou.html">

      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email Address" required>
      <textarea name="message" placeholder="Your message or order details..." required></textarea>
      <button type="submit" class="submit-btn">Send Message</button>
    </form>
  </div>

  <div class="logo-container">
    <div class="social-logo">
      <a href="https://wa.me/923444215230" target="_blank">
        <img src="img/whatsapp.jpg" alt="WhatsApp">
      </a>
    </div>
    <div class="social-logo">
      <a href="https://www.instagram.com/z.globalstore?igsh=cjl5emF5bWpjNGtr" target="_blank">
        <img src="img/insta.jpg" alt="Instagram">
      </a>
    </div>
    <div class="social-logo">
      <img src="img/facebook.jpg" alt="Facebook">
    </div>
  </div>
</div>

<script>
  function toggleMenu() {
    document.getElementById('sidebar').classList.toggle('active');
  }

  function goTo(section) {
    if (section === 'home') {
      window.location.href = 'index.html';
    } else if (section === 'quran') {
      window.location.href = 'products.html';
    } else if (section === 'contact') {
      window.location.href = 'contact.html';
    }
  }
</script>

</body>
</html>
