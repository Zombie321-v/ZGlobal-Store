<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quran & Seerat Books – Coming Soon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: #fff;
      color: #000;
      overflow-x: hidden;
    }

    .container {
      height: 100vh;
      width: 100%;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 2rem;
    }

    .neon-box {
      border: 2px solid black;
      border-radius: 15px;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
      background: #fff;
      transition: 0.4s ease-in-out;
      position: relative;
      animation: glowBorder 2s infinite alternate;
    }

    @keyframes glowBorder {
      from {
        box-shadow: 0 0 10px #000;
      }
      to {
        box-shadow: 0 0 30px #000;
      }
    }

    h1 {
      font-size: 2.5rem;
      color: black;
      margin-bottom: 1rem;
      text-transform: uppercase;
      font-weight: bold;
      position: relative;
    }

    h1::after {
      content: "";
      width: 60%;
      height: 3px;
      background: gold;
      position: absolute;
      bottom: -10px;
      left: 20%;
      border-radius: 2px;
      animation: underline 2s infinite alternate;
    }

    @keyframes underline {
      from {
        width: 40%;
        left: 30%;
      }
      to {
        width: 70%;
        left: 15%;
      }
    }

    p {
      font-size: 1.2rem;
      color: #222;
      margin-top: 1rem;
    }

    .soon-btn {
      margin-top: 2rem;
      padding: 0.8rem 2rem;
      background: black;
      color: white;
      font-weight: bold;
      border: 2px solid gold;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
      font-size: 1rem;
      box-shadow: 0 0 10px gold;
    }

    .soon-btn:hover {
      background: gold;
      color: black;
      box-shadow: 0 0 20px gold, 0 0 30px gold inset;
      transform: scale(1.05);
    }

    .neon-icon {
      font-size: 3rem;
      color: black;
      margin-bottom: 1.5rem;
      animation: flicker 1.5s infinite alternate;
    }

    @keyframes flicker {
      0% { opacity: 1; text-shadow: 0 0 5px #000; }
      100% { opacity: 0.7; text-shadow: 0 0 20px #000; }
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.9rem;
      color: gray;
    }

    @media (max-width: 600px) {
      .neon-box {
        padding: 2rem 1rem;
      }
      h1 {
        font-size: 2rem;
      }
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="neon-box">
      <div class="neon-icon"><i class="fas fa-book-open-reader"></i></div>
      <h1>Quran & Seerat Books</h1>
      <p>This section is coming very soon. Stay tuned for amazing Islamic reads!</p>
      <button class="soon-btn" onclick="window.location.href='index.html'">
        🔙 Back to Home
      </button>
    </div>
    <footer>
      &copy; 2025 Z Global Store 🌏 — All Rights Reserved
    </footer>
  </div>

</body>
</html>
