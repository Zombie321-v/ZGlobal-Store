    function toggleMenu() {
      document.getElementById('sidebar').classList.toggle('active');
    }

    function showSection(sectionId) {
      document.getElementById('cards').style.display = 'none';
      document.getElementById('backBtn').style.display = 'block';
      document.getElementById('section1').style.display = 'none';
      document.getElementById('section2').style.display = 'none';
      if (sectionId === 'section1') {
        renderPaginated('section1', products1, 12);
      } else {
        renderPaginated('section2', products2, 13);
      }
    }

    function renderPaginated(sectionId, productList, perPage, page = 1) {
      const start = (page - 1) * perPage;
      const paginated = productList.slice(start, start + perPage);
 let html = paginated.map(p => `
  <div class="product" onclick="openProduct('${p.img}', '${p.title}', '${p.price}', \`${p.desc || ''}\`)">
    <img src="${p.img}" alt="${p.title}">
    <h3 style="margin-top: 0.5rem;">${p.title}</h3>
  </div>
`).join('');

      const totalPages = Math.ceil(productList.length / perPage);
      html += '<div class="pagination">';
      for (let i = 1; i <= totalPages; i++) {
        html += `<button onclick="renderPaginated('${sectionId}', ${sectionId === 'section1' ? 'products1' : 'products2'}, ${perPage}, ${i})">${i}</button>`;
      }
      html += '</div>';
      document.getElementById(sectionId).innerHTML = html;
      document.getElementById(sectionId).style.display = 'block';
    }

    function goBack() {
      document.getElementById('cards').style.display = 'flex';
      document.getElementById('backBtn').style.display = 'none';
      document.getElementById('section1').style.display = 'none';
      document.getElementById('section2').style.display = 'none';
    }

    function orderNow(product, price) {
      const msg = `I want to buy ${product} for Rs. ${price}`;
      window.open(`https://wa.me/923006264072?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function openProduct(img, title, price, desc) {
  const overlay = document.createElement('div');
  overlay.className = 'product-overlay';
  overlay.innerHTML = `
    <div class="product-popup">
      <span class="close-btn" onclick="closePopup(this)">&times;</span>
      <img src="${img}" alt="${title}">
      <div class="details">
        <h2>${title}</h2>
        <p>${desc}</p>
        <p>Price: Rs. ${price}</p>
        <button class="order-btn" onclick="orderNow('${title}', '${price}')">Add to Cart</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

    function closePopup(el) {
      const popup = el.closest('.product-overlay');
      popup.remove();
    }
